name: ATS CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  # ============================================================
  # CI JOB
  # ============================================================
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Python Backend Validation
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Python Syntax
        run: |
          python -m compileall -q backend

      # --------------------------------------------------------
      # Frontend Validation
      # --------------------------------------------------------

      - name: Validate Frontend Files
        run: |
          test -f frontend/index.html
          test -f frontend/style.css
          test -f frontend/script.js

      - name: Check HTML
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path("frontend/index.html").read_text(encoding="utf-8")

          if "<html" not in html.lower():
              raise SystemExit("ERROR: <html> tag not found")

          if "</html>" not in html.lower():
              raise SystemExit("ERROR: closing </html> tag not found")

          if "<script" not in html.lower():
              raise SystemExit("ERROR: JavaScript script tag not found")

          print("Frontend HTML validation passed.")
          PY

      # --------------------------------------------------------
      # Ensure secrets are not accidentally committed
      # --------------------------------------------------------

      - name: Check for Environment Files
        run: |
          if find . -name ".env" -o -name ".env.*" | grep -v ".env.example"; then
            echo "ERROR: Environment files detected in repository."
            exit 1
          fi

          echo "No environment files detected."


  # ============================================================
  # BUILD JOB
  # ============================================================
  build:
    name: Build GitHub Pages Site
    runs-on: ubuntu-latest
    needs: ci

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Copy only frontend files into deployment directory
      - name: Prepare Static Website
        run: |
          mkdir -p _site
          cp -R frontend/* _site/

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site


  # ============================================================
  # CD JOB
  # ============================================================
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
