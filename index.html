<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FeelIQ Resume Analyzer</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">

            <img src="assets/Feeliq.webp" alt="FeelIQ Logo">

            <h1>Resume Analysis Portal</h1>

            <p>Upload a candidate's resume for AI-powered analysis.</p>

        </div>

        <form id="resumeForm">

            <div class="input-group">

                <label>Candidate Name</label>

                <input
                    type="text"
                    id="candidateName"
                    placeholder="Enter candidate name"
                    required>

            </div>

            <div class="input-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email address"
                    required>

            </div>

            <div class="input-group">

                <label>Job Role</label>

                <input
                    type="text"
                    id="jobRole"
                    placeholder="Example : AI Engineer"
                    required>

            </div>

            <div class="input-group">

                <label>Upload Resume</label>

                <label for="resume" class="upload-box">

                    <i class="fa-solid fa-cloud-arrow-up"></i>

                    <h3>Choose Resume</h3>

                    <p>PDF • DOC • DOCX</p>

                </label>

                <input
                    type="file"
                    id="resume"
                    accept=".pdf,.doc,.docx"
                    hidden>

                <div id="fileName">

                    No file selected

                </div>

            </div>

            <button type="submit" id="submitBtn">

                Submit

            </button>

        </form>

        <div id="status"></div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
